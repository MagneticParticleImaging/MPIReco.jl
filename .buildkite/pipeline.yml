steps:
  - label: "Nvidia GPUs -- MPIReco.jl"
    if: build.pull_request.labels includes "run-gpu-ci" || build.branch == "master"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.10"
    agents:
      queue: "cuda"
    command: |
      julia --color=yes --project -e '
      using Pkg
      Pkg.add("TestEnv")
      using TestEnv
      TestEnv.activate();
      Pkg.add("CUDA")
      Pkg.instantiate()
      include("test/gpu/cuda.jl")'
    timeout_in_minutes: 30

  - label: "AMD GPUs -- MPIReco.jl"
    if: build.pull_request.labels includes "run-gpu-ci" || build.branch == "master"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.10"
    agents:
      queue: "rocm"
      rocmgpu: "*"
    command: |
      julia --color=yes --project -e '
      using Pkg
      Pkg.add("TestEnv")
      using TestEnv
      TestEnv.activate();
      Pkg.add("AMDGPU")
      Pkg.instantiate()
      include("test/gpu/rocm.jl")'
    timeout_in_minutes: 30
    soft_fail: true
